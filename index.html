<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tally-cam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f12; --panel: #15181d; --line: #252a31;
    --text: #e7e9ec; --muted: #8a919b; --accent: #f2b544;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Noto Sans KR", system-ui, sans-serif; line-height: 1.55;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 22px; margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .stamp { font-family: "IBM Plex Mono", monospace; color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 32px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: #000; cursor: zoom-in; }
  .meta { padding: 14px 16px 16px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .name { font-weight: 700; font-size: 16px; }
  .time { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
  .count { margin-top: 10px; font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--muted); }
  .count b { color: var(--accent); font-weight: 500; }
  .strip { display: flex; gap: 4px; margin-top: 12px; overflow-x: auto; }
  .strip img { width: 56px; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 3px; opacity: .55; cursor: pointer; }
  .strip img.on, .strip img:hover { opacity: 1; }
  footer { margin-top: 48px; color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); margin-top: 32px; }
  dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; }
  dialog img { max-width: 96vw; max-height: 90vh; display: block; }
  dialog::backdrop { background: rgba(0,0,0,.85); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>tally<span>·</span>cam</h1>
      <p class="sub">Count anything. Track everything. — 경부고속도로 동탄 일대</p>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>아직 수집된 스냅샷이 없어요. Actions에서 snapshot 워크플로를 한 번 실행해 주세요.</p>
  <footer>영상 출처: 국토교통부 ITS 국가교통정보센터 (공공누리 제1유형)</footer>
</div>
<dialog id="zoom"><img alt=""></dialog>
<script>
const fmt = iso => iso ? iso.replace("T", " ").slice(0, 16) : "—";
const fromFile = f => { const m = f.match(/(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/); return m ? `${m[2]}/${m[3]} ${m[4]}:${m[5]}` : f; };
const zoom = document.getElementById("zoom");
zoom.addEventListener("click", () => zoom.close());

fetch(`data/index.json?t=${Date.now()}`)
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(idx => {
    document.getElementById("stamp").textContent = `마지막 수집 ${fmt(idx.updated)} KST`;
    const grid = document.getElementById("grid");
    const cams = Object.entries(idx.cameras || {}).filter(([, c]) => c.updated);
    if (!cams.length) { document.getElementById("empty").hidden = false; return; }
    for (const [slug, c] of cams) {
      const card = document.createElement("article");
      card.className = "card";
      const v = encodeURIComponent(c.updated);
      card.innerHTML = `
        <img class="main" src="data/${slug}/latest.jpg?v=${v}" alt="${c.label} CCTV 스냅샷" loading="lazy">
        <div class="meta">
          <div class="row"><span class="name">${c.label}</span><span class="time">${fmt(c.updated)}</span></div>
          <div class="count">오늘 지나간 차량 <b>—</b> · 카운팅 준비 중</div>
          <div class="strip"></div>
        </div>`;
      const main = card.querySelector(".main");
      const time = card.querySelector(".time");
      main.addEventListener("click", () => { zoom.querySelector("img").src = main.src; zoom.showModal(); });
      const strip = card.querySelector(".strip");
      (c.history || []).forEach((f, i) => {
        const t = document.createElement("img");
        t.src = `data/${slug}/${f}`; t.loading = "lazy"; t.title = fromFile(f);
        if (i === 0) t.className = "on";
        t.addEventListener("click", () => {
          main.src = t.src; time.textContent = fromFile(f);
          strip.querySelectorAll("img").forEach(x => x.classList.toggle("on", x === t));
        });
        strip.appendChild(t);
      });
      grid.appendChild(card);
    }
  })
  .catch(() => { document.getElementById("empty").hidden = false; });
</script>
</body>
</html>
