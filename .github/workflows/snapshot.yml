name: snapshot

on:
  # KST 07:17 / 13:17 / 20:17 (UTC 기준 표기). 개발용 키 월 100건 한도 → 하루 3회 = 월 ~93건
  schedule:
    - cron: "17 22,4,11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Take snapshots
        env:
          ITS_API_KEY: ${{ secrets.ITS_API_KEY }}
        run: python3 scripts/snapshot.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "snapshot $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
